<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f6f4"/>
      <stop offset="100%" stop-color="#eaf1f8"/>
    </linearGradient>
    <linearGradient id="bookA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26a69a"/>
      <stop offset="100%" stop-color="#00796b"/>
    </linearGradient>
    <linearGradient id="bookB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c9ce6"/>
      <stop offset="100%" stop-color="#4479A1"/>
    </linearGradient>
    <linearGradient id="bookC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#009688"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="200" fill="url(#bg)"/>

  <!-- linha da "prateleira" -->
  <rect x="30" y="168" width="840" height="6" rx="3" fill="#4479A1" opacity="0.35"/>

  <!-- livros bailando, cada um com altura e atraso diferentes -->
  <g font-family="Fira Code, monospace">
    <!-- livro 1 -->
    <g transform="translate(70,0)">
      <rect x="0" y="90" width="46" height="78" rx="4" fill="url(#bookA)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -22;0 0" dur="1.6s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- livro 2 -->
    <g transform="translate(140,0)">
      <rect x="0" y="70" width="46" height="98" rx="4" fill="url(#bookB)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -22;0 0" dur="1.6s" begin="0.15s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- livro 3 -->
    <g transform="translate(210,0)">
      <rect x="0" y="50" width="46" height="118" rx="4" fill="url(#bookC)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -22;0 0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- livro central em destaque, abrindo e fechando -->
    <g transform="translate(400,55)">
      <rect x="-70" y="0" width="140" height="14" rx="3" fill="#004d40"/>
      <!-- pagina esquerda -->
      <rect x="-68" y="14" width="66" height="98" rx="3" fill="#ffffff" stroke="#4479A1" stroke-width="2"/>
      <!-- pagina direita: anima como se estivesse virando -->
      <rect x="2" y="14" width="66" height="98" rx="3" fill="#ffffff" stroke="#009688" stroke-width="2">
        <animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;-0.15 1;1 1" dur="2.2s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
      </rect>
      <!-- linhas de texto simulando conteudo -->
      <line x1="-58" y1="30" x2="-16" y2="30" stroke="#b0d9d3" stroke-width="3"/>
      <line x1="-58" y1="44" x2="-20" y2="44" stroke="#b0d9d3" stroke-width="3"/>
      <line x1="-58" y1="58" x2="-24" y2="58" stroke="#b0d9d3" stroke-width="3"/>
      <line x1="12" y1="30" x2="54" y2="30" stroke="#bcd7ea" stroke-width="3"/>
      <line x1="12" y1="44" x2="50" y2="44" stroke="#bcd7ea" stroke-width="3"/>
      <line x1="12" y1="58" x2="46" y2="58" stroke="#bcd7ea" stroke-width="3"/>
      <!-- paginas "voando" -->
      <rect x="20" y="10" width="18" height="24" rx="2" fill="#ffffff" stroke="#009688" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.45;0.7;1" dur="2.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;30 -40;60 -70" keyTimes="0;0.45;0.7;1" dur="2.2s" repeatCount="indefinite" additive="sum"/>
        <animateTransform attributeName="transform" type="rotate" values="0 30 20;0 30 20;25 30 20;55 30 20" keyTimes="0;0.45;0.7;1" dur="2.2s" repeatCount="indefinite" additive="sum"/>
      </rect>
    </g>
    <!-- livro 5 -->
    <g transform="translate(600,0)">
      <rect x="0" y="60" width="46" height="108" rx="4" fill="url(#bookC)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -22;0 0" dur="1.6s" begin="0.15s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- livro 6 -->
    <g transform="translate(670,0)">
      <rect x="0" y="80" width="46" height="88" rx="4" fill="url(#bookB)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -22;0 0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- livro 7 -->
    <g transform="translate(740,0)">
      <rect x="0" y="45" width="46" height="123" rx="4" fill="url(#bookA)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -22;0 0" dur="1.6s" begin="0.45s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <text x="450" y="196" text-anchor="middle" font-family="Fira Code, monospace" font-size="14" fill="#00695c">
    API de Livros · CRUD em ação
  </text>
</svg>
